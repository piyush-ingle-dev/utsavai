[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = ["e2e: browser tests that need Playwright (run with: pytest -m e2e)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
"catalog.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app.py", "api.py", "config.py", "extensions.py", "models.py", "planner.py", "schemas.py", "security.py", "catalog.py", "agents"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "frontend/*", "web/*", ".venv/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
